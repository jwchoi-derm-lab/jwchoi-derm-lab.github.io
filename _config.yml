# Welcome to Jekyll!
#
# Site Settings
locale                   : "en-US"
title                    : "Jeewoong Derm Lab"
title_separator          : "-"
name                     : "Jeewoong (Jiwoong) Choi, MD, PhD"
description              : "Dermatology · Skin Microbiome · Epidemiology · Bioinformatics"
url                      : "https://jwchoi-derm-lab.github.io"
baseurl                  : ""
repository               : "jwchoi-derm-lab/jwchoi-derm-lab.github.io"
teaser                   :

# Site Author
author:
  name             : "Jeewoong (Jiwoong) Choi, MD, PhD"
  avatar           : "/images/profile.png" # Upload your photo as /images/profile.png or profile.jpg
  bio              : "Dermatologic Surgeon & Computational Biologist"
  location         : "Suwon & Seongnam, South Korea"
  employer         : "Ajou University School of Medicine"
  uri              : "https://www.ajoumc.or.kr/medicineEn/univ/profView.do?deptTp=&deptNo=65&no=660"
  email            : "jwchoi.derm.lab@gmail.com"
  researchgate     :
  pubmed           : # Removed pubmed link as requested
  googlescholar    :
  github           : "jwchoi-derm-lab"

# Reading Files
include:
  - .htaccess
  - _pages
  - _posts
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp

# Markdown Processing
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Analytics
analytics:
  provider               : false
