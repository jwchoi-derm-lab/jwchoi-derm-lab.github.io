# .github/workflows/monthly-news-update.yml
#
# Regenerates _pages/news.md on the 20th of every month with the prior
# month's dermatology news from EurekAlert!, News-Medical, and Medical
# News Today, polished with the Gemini API (Google AI Studio key), then
# commits and pushes automatically.
#
# Setup:
#   1. Save this file at .github/workflows/monthly-news-update.yml
#   2. Save the scraper at scripts/generate_news.py
#   3. Add a repo secret named GEMINI_API_KEY
#      (Settings > Secrets and variables > Actions > New repository secret)
#      using the key you generated at https://aistudio.google.com/
#
# GitHub Actions cron runs in UTC. "0 0 20 * *" fires at 00:00 UTC
# (09:00 KST) on the 20th of every month.

name: Monthly News Update

on:
  schedule:
    - cron: "0 0 20 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-generativeai

      - name: Run news generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_news.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: monthly dermatology news digest (Gemini-polished)"
          file_pattern: "_pages/news.md"
          commit_user_name: "jeewoong-derm-lab-bot"
          commit_user_email: "actions@github.com"
