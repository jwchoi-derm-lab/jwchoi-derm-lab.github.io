name: Monthly News Update

on:
  schedule:
    - cron: "0 0 20 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monthly-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 google-genai

      - name: Inspect existing news file
        run: |
          git log -1 --format="%h %ad %s" -- _pages/news.md
          if [ -f _pages/news.md ]; then
            sha256sum _pages/news.md
          fi
      - name: List available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai
          from google.genai import types

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"],
              http_options=types.HttpOptions(
                  api_version="v1beta"
              ),
          )

          count = 0

          for model in client.models.list():
              actions = model.supported_actions or []

              if "generateContent" in actions:
                  count += 1
                  print(
                      f"[MODEL] {model.name} | "
                      f"actions={actions}"
                  )

          if count == 0:
              raise RuntimeError(
                  "No generateContent models were returned."
              )
          PY
      - name: Run news generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/generate_news.py

      - name: Inspect generated news
        run: |
          test -s _pages/news.md
          sha256sum _pages/news.md
          git diff --stat -- _pages/news.md
          git diff -- _pages/news.md

      - name: Save generated news for inspection
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-${{ github.run_id }}
          path: _pages/news.md
          retention-days: 14

      - name: Commit and push if changed
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: monthly dermatology news digest"
          file_pattern: "_pages/news.md"
          commit_user_name: "jeewoong-derm-lab-bot"
          commit_user_email: "actions@github.com"

      - name: Report commit result
        env:
          CHANGES_DETECTED: ${{ steps.auto_commit.outputs.changes_detected }}
          COMMIT_HASH: ${{ steps.auto_commit.outputs.commit_hash }}
        run: |
          echo "Changes detected: $CHANGES_DETECTED"
          echo "Commit hash: $COMMIT_HASH"
          echo "If the file changed, verify that a Pages deployment also ran."
